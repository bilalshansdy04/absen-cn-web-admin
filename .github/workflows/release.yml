name: Release Web Admin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (contoh: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Production Build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Install Playwright Chromium & Run E2E Tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "Release ${{ inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
